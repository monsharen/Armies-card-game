<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kartenburg</title>
  <link rel="stylesheet" href="css/style.css?v=20260728o">
</head>
<body class="pixel-mode app on-title">
  <canvas id="swirlCanvas" class="swirl-canvas" aria-hidden="true"></canvas>
  <div class="bg-swirl" aria-hidden="true"></div>

  <main>
    <div id="titleScreen" onclick="enterMenu()">
      <div id="titleFx" aria-hidden="true"></div>
      <div class="title-stack">
        <h1 class="pixel-title wave" data-scale="7">Kartenburg</h1>
      </div>
      <button class="press-start" type="button" onclick="enterMenu()"><span class="pixel-title" data-scale="2" data-color="#ffffff">Tap to start</span></button>
    </div>

    <div id="setup" class="hidden">
      <div id="menuFx" aria-hidden="true"></div>
      <h2 class="pixel-title wave" data-scale="5">Kartenburg</h2>
      <div class="menu-list" id="menuMain">
        <button class="btn primary big" onclick="showPlayerSelect()"><span class="pixel-title" data-scale="2" data-color="#ffffff">New Game</span></button>
        <button class="btn big" onclick="startTutorial()"><span class="pixel-title" data-scale="2" data-color="#ffffff">Tutorial</span></button>
        <span class="menu-divider"></span>
        <button class="btn" onclick="openHowto(false)"><span class="pixel-title" data-scale="2" data-color="#ffffff">How to Play</span></button>
        <button class="btn" onclick="window.open('reference.html', '_blank')"><span class="pixel-title" data-scale="2" data-color="#ffffff">Print &amp; Play</span></button>
        <button class="btn muteBtn" onclick="toggleSound()"><span class="pixel-title" data-scale="2" data-color="#ffffff">Sound on</span></button>
      </div>
      <div class="menu-list hidden" id="menuPlayers">
        <button class="btn primary big" onclick="newGame(1)"><span class="pixel-title" data-scale="2" data-color="#ffffff">1 Player</span></button>
        <button class="btn big" onclick="newGame(2)"><span class="pixel-title" data-scale="2" data-color="#ffffff">2 Players</span></button>
        <button class="btn big" onclick="newGame(3)"><span class="pixel-title" data-scale="2" data-color="#ffffff">3 Players</span></button>
        <button class="btn big" onclick="newGame(4)"><span class="pixel-title" data-scale="2" data-color="#ffffff">4 Players</span></button>
        <span class="menu-divider"></span>
        <button class="btn" onclick="showMainMenu()"><span class="pixel-title" data-scale="2" data-color="#ffffff">Back</span></button>
      </div>
    </div>

    <div id="gameArea" class="hidden">
      <div id="hud">
        <span class="hud-brand pixel-title" data-scale="2">Kartenburg</span>
        <div class="hud-right">
          <span id="hudInfo"></span>
          <button class="btn slim" onclick="toggleLogDrawer()" title="Chronicle">📜</button>
          <button class="btn slim" onclick="togglePause(true)" title="Menu">☰</button>
        </div>
      </div>
      <div class="board-viewport">
        <div class="board-scale">
          <div class="board-wrap">
            <div id="board"></div>
          </div>
        </div>
      </div>
      <div id="bottomBar">
        <div id="handArea"></div>
        <div id="turnPanel"></div>
      </div>
    </div>

    <div id="howto" class="hidden">
      <div class="howto-frame">
        <h2 id="howtoTitle"></h2>
        <div id="howtoBody"></div>
        <div class="howto-nav">
          <button class="btn" id="howtoPrev" onclick="howtoStep(-1)">◀</button>
          <span id="howtoDots"></span>
          <button class="btn" id="howtoNext" onclick="howtoStep(1)">▶</button>
        </div>
        <button class="btn primary" onclick="closeHowto()">Close</button>
      </div>
    </div>

    <div id="logDrawer" class="hidden">
      <h3><span class="pixel-title" data-scale="2">Chronicle</span></h3>
      <div id="log" class="log-panel"></div>
      <button class="btn" onclick="toggleLogDrawer()">Close</button>
    </div>

    <div id="pauseMenu" class="modal-backdrop hidden">
      <div class="modal">
        <h2 class="pixel-title" data-scale="3">Paused</h2>
        <div class="pause-buttons">
          <button class="btn primary" onclick="togglePause(false)"><span class="pixel-title" data-scale="2" data-color="#ffffff">Resume</span></button>
          <button class="btn muteBtn" onclick="toggleSound()"><span class="pixel-title" data-scale="2" data-color="#ffffff">Sound on</span></button>
          <button class="btn" onclick="toggleFullscreen()"><span class="pixel-title" data-scale="2" data-color="#ffffff">Fullscreen</span></button>
          <button class="btn" onclick="toggleLogDrawer(); togglePause(false)"><span class="pixel-title" data-scale="2" data-color="#ffffff">Chronicle</span></button>
          <button class="btn" onclick="openHowto(true)"><span class="pixel-title" data-scale="2" data-color="#ffffff">How to Play</span></button>
          <button class="btn" onclick="backToSetup()"><span class="pixel-title" data-scale="2" data-color="#ffffff">Abandon war</span></button>
        </div>
      </div>
    </div>
  </main>

  <div id="actionModal" class="modal-backdrop hidden">
    <div class="modal action-modal">
      <h2 id="amTitle"></h2>
      <div id="amBody"></div>
    </div>
  </div>

  <div id="handoff" class="modal-backdrop hidden">
    <div class="modal">
      <p id="handoffText"></p>
      <button class="btn primary big" onclick="revealTurn()">Begin turn</button>
    </div>
  </div>

  <div id="endModal" class="modal-backdrop hidden">
    <div class="modal">
      <h2 class="pixel-title wave" data-scale="3">The War Ends</h2>
      <p id="endVerdict" class="verdict"></p>
      <table id="endTable"></table>
      <div style="display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap">
        <button class="btn primary" onclick="hideEndModal(); newGame(ui.numHumans)">⚔️ Rematch</button>
        <button class="btn" onclick="backToSetup()">Main menu</button>
        <button class="btn" onclick="hideEndModal()">Inspect the field</button>
      </div>
    </div>
  </div>

  <div id="fx"></div>

  <div id="tutorBox" class="hidden">
    <div class="tut-head"><span class="pixel-title" data-scale="2" data-color="#d4a72c">Tutorial</span></div>
    <div id="tutText" class="tut-text"></div>
    <div class="tut-actions">
      <button class="btn primary" id="tutNextBtn" onclick="tutNext()">Next ▶</button>
      <button class="btn slim" onclick="tutSkip()">Skip tutorial</button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="hintBar" class="hidden"></div>

  <script src="js/swirl.js?v=20260728o"></script>
  <script src="js/pixeltext.js?v=20260728o"></script>
  <script src="js/cards.js?v=20260728o"></script>
  <script src="js/engine.js?v=20260728o"></script>
  <script src="js/ui.js?v=20260728o"></script>
  <script src="js/consoleui.js?v=20260728o"></script>
</body>
</html>
